<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prime Physique</title>
    
    <!-- Librería de Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <!-- Iconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Estilos de Tailwind CSS y Colores Cyberpunk -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        neonRed: '#ff003c',
                        cyberDark: '#0a0a0a',
                        cyberCard: '#111111',
                        cyberCarbon: '#1a1a1a'
                    }
                }
            }
        }
    </script>
    
    <style>
        body { background-color: #000000; color: #ffffff; }
        .neon-glow-button {
            background: linear-gradient(45deg, #ff003c, #cc0030);
            box-shadow: 0 0 10px rgba(255, 0, 60, 0.4);
            transition: all 0.2s;
        }
        .neon-glow-button:hover {
            box-shadow: 0 0 20px rgba(255, 0, 60, 0.6);
        }
    </style>
</head>
<body class="pb-20 font-sans antialiased">

    <!-- Aquí se inyecta la pantalla de login o el panel del usuario automáticamente -->
    <div id="app-content" class="p-4 max-w-lg mx-auto"></div>

    <!-- Barra de navegación inferior -->
    <nav class="fixed bottom-0 w-full bg-cyberDark border-t border-gray-800 p-3 pb-safe z-50">
        <div class="max-w-lg mx-auto flex justify-around text-xs">
            <button id="btn-perfil" onclick="switchTab('perfil')" class="flex flex-col items-center text-gray-500 hover:text-neonRed">
                <i class="fa-solid fa-user text-lg mb-1"></i> Perfil
            </button>
            <button id="btn-entrenamiento" onclick="switchTab('entrenamiento')" class="flex flex-col items-center text-gray-500 hover:text-neonRed">
                <i class="fa-solid fa-dumbbell text-lg mb-1"></i> Entreno
            </button>
            <button id="btn-alimentacion" onclick="switchTab('alimentacion')" class="flex flex-col items-center text-gray-500 hover:text-neonRed">
                <i class="fa-solid fa-utensils text-lg mb-1"></i> Nutrición
            </button>
            <button id="btn-videoteca" onclick="switchTab('videoteca')" class="flex flex-col items-center text-gray-500 hover:text-neonRed">
                <i class="fa-solid fa-video text-lg mb-1"></i> Videoteca
            </button>
        </div>
    </nav>

    <!-- Conexión a tu lógica de Javascript -->
    <script src="app.js"></script>
</body>
</html>

<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, interactive-widget=resizes-content"
    />
    <title>Prime Physique</title>

    <!-- Marca: app instalable (manifest + íconos), color de la barra del celular y ícono para iPhone -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#0a0a0a" />
    <link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="/icons/favicon-48.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Prime Physique" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />

    <!-- Vite: estilos (Tailwind + Font Awesome) y lógica de la app -->
    <link rel="stylesheet" href="/src/styles/main.css" />
    <script type="module" src="/src/main.js"></script>
  </head>
  <body class="pb-20 font-sans antialiased">
    <div id="app-content" class="p-4 max-w-lg md:max-w-3xl mx-auto"></div>

    <nav class="fixed bottom-0 w-full bg-cyberDark border-t border-gray-800 p-3 pb-safe z-50">
      <div class="max-w-lg mx-auto flex justify-around text-xs">
        <button
          id="btn-perfil"
          data-click="switchTab"
          data-tab="perfil"
          class="flex flex-col items-center text-gray-500 hover:text-neonRed"
        >
          <i class="fa-solid fa-user text-lg mb-1"></i> Perfil
        </button>
        <button
          id="btn-entrenamiento"
          data-click="switchTab"
          data-tab="entrenamiento"
          class="flex flex-col items-center text-gray-500 hover:text-neonRed"
        >
          <i class="fa-solid fa-file-excel text-lg mb-1"></i> Planilla
        </button>
        <button
          id="btn-material"
          data-click="switchTab"
          data-tab="material"
          class="flex flex-col items-center text-gray-500 hover:text-neonRed"
        >
          <i class="fa-solid fa-book-open text-lg mb-1"></i> Material
        </button>
      </div>
    </nav>

    <!-- Modal inyectado del Tracker -->
    <div id="modal-video-preview" class="modal-overlay hidden">
      <div class="modal-video-card">
        <button class="modal-close-btn" data-click="cerrarModalVideo">✕</button>
        <h4 id="video-modal-title" style="font-size: 0.95rem; font-weight: 700; color: white; padding-right: 20px">
          Demostración
        </h4>
        <div id="video-iframe-container"></div>
      </div>
    </div>
  </body>
</html>
